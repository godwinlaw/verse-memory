name: CI

# The pre-merge gate. deploy.yml re-runs lint/format/unit on push to main
# before it ships, but the Playwright suite runs nowhere else in CI, so this
# workflow is the only place a browser drives the app before code lands.
#
# One job on purpose: it produces a single required status check
# ("Lint, format, unit, browser tests"), so main's branch protection gates on
# one context and steps can be added or dropped without ever touching the
# protection settings again. Runs on PRs and on push to main so the check is
# recorded on the branch itself too, and is dispatchable by hand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, format, unit, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # Both Playwright projects — the desktop "chromium" project and the
      # "mobile" project that claims to be a Pixel 5 — run on the Chromium
      # engine, so that is all we install. --with-deps adds the OS libraries a
      # headless browser needs on the runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.mjs starts the static server itself (its webServer
      # block), so there is nothing to launch here. CI=true — set by Actions —
      # is what turns on retries, two workers, and forbid-only.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
