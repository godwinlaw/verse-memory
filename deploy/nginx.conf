server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets (JS modules, HTML, CSS, JSON data).
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache immutable-ish app source and data; the CDN libs are versioned.
  location ~* \.(js|css)$ {
    add_header Cache-Control "public, max-age=3600";
  }

  # Never cache the entry document or runtime config.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /config.js  { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri $uri/ =404;
  }
}
