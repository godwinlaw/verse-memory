<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Verse Mastery">
  <!-- "Marked passage" — the ribbon marker cut from paper on a steel field,
       rules standing in for the passage it holds. Square-cornered and edge to
       edge like every other object in the blueprint system.

       The colours are the accent-900 and paper tokens from styles.css written
       out, because a standalone SVG has no :root to read them from.

       This carries the design's 48px cut, two rules, rather than the three-rule
       drawing it is shown large as: browsers that take an SVG icon use it at
       every size, tab included, and the third rule closes up into grey below
       about 40px. favicon.ico carries the 24px cut for the same reason. See
       "App Icon.dc.html" (1C) in the design project. -->
  <!-- A standalone SVG has no :root to read tokens from, but it can still ask
       the reader which way round they want the world. These are the same two
       values styles.css sets for --color-reverse-bg in each theme: the plate
       lifts off a dark page rather than sinking into it.

       This is the one place the member's own choice under Settings cannot
       reach, and there is no version of it that could: the browser fetches this
       file on its own, outside the page, so it has no data-theme to read and no
       localStorage to ask. A tab icon therefore keeps following the system even
       for a member who asked the app for the other ground — which is the right
       way round anyway, since the tab strip it sits in belongs to the browser
       and is painted the system's way too. -->
  <style>
    .field { fill: #1d2d3d }
    .rule { stroke: #1d2d3d }
    @media (prefers-color-scheme: dark) {
      .field { fill: #26384a }
      .rule { stroke: #26384a }
    }
  </style>
  <rect width="64" height="64" class="field" fill="#1d2d3d"/>
  <polygon points="19,8 45,8 45,56 32,46 19,56" fill="#f2f2f3"/>
  <g class="rule" stroke="#1d2d3d" stroke-width="3.2">
    <path d="M24 21H40"/>
    <path d="M24 31H36"/>
  </g>
</svg>
